name: slapp
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.0

# Every swappable dependency carries a `# STACK_<NAME>` marker on its own line
# directly above it. `tool/stack.py` reads those markers to strip the providers a
# child app did not pick, so keep one marker per line and never share a line.
dependencies:
  amplitude_flutter: ^4.3.2 # STACK_AMPLITUDE
  auto_route: ^10.1.0
  cloud_firestore: ^5.6.2 # STACK_FIREBASE
  collection: ^1.17.1
  crypto: ^3.0.6
  csv: ^6.0.0
  device_info_plus: ^11.1.1
  firebase_analytics: ^11.5.2 # STACK_FIREBASE_ANALYTICS
  firebase_auth: ^5.4.1 # STACK_FIREBASE
  firebase_core: ^3.10.1 # STACK_FIREBASE STACK_FIREBASE_ANALYTICS STACK_FIREBASE_CRASHLYTICS
  firebase_crashlytics: ^4.3.9 # STACK_FIREBASE_CRASHLYTICS
  flex_color_scheme: ^8.0.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.0
  flutter_svg: ^2.0.14
  flutter_web_plugins:
    sdk: flutter
  get_it: ^8.0.3
  google_sign_in: ^7.1.0
  http: ^1.2.2
  in_app_review: ^2.0.10
  injectable: ^2.5.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  json_schema: ^5.2.1
  package_info_plus: ^8.3.0
  permission_handler: ^12.0.1
  pocketbase: ^0.23.0 # STACK_POCKETBASE
  purchases_flutter: ^9.9.8
  recase: 4.1.0
  sentry_flutter: ^9.14.0 # STACK_SENTRY
  shared_preferences: ^2.3.5
  sign_in_with_apple: ^6.1.0
  signals: ^6.0.2
  simple_mvvm: ^1.0.1
  supabase_flutter: ^2.8.3 # STACK_SUPABASE
  transparent_image: ^2.0.1
  universal_html: ^2.2.4
  universal_io: 2.2.2
  url_launcher: ^6.3.1

dependency_overrides:
  openai_dart: 0.5.2

dev_dependencies:
  auto_route_generator: ^10.2.3
  build_runner: ^2.4.13

  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  injectable_generator: ^2.6.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
  # Bundled rather than fetched by google_fonts at first launch. The four files
  # are byte-identical to what fonts.gstatic.com serves (SHA-256 checked against
  # the hashes in google_fonts 8.0.2), so nothing about the rendering changes --
  # only when it is available. Licence in assets/fonts/LICENSE.txt (OFL 1.1).
  fonts:
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-Regular.ttf
          weight: 400
        - asset: assets/fonts/Quicksand-Medium.ttf
          weight: 500
        - asset: assets/fonts/Quicksand-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Quicksand-Bold.ttf
          weight: 700