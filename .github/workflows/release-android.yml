##
# Build the app on every push to main and upload it to the Play INTERNAL track.
#
# This runs on the self-hosted runners on `chonky`, which serve every repo in the
# Sapid-Labs org. Nothing here needs changing for a new app EXCEPT the Flutter
# version pin below — the secrets are per-repo and are set once with
# `scripts/bootstrap_ci_secrets.sh`.
#
# Read docs/ci-android.md before changing any of this. Every step that looks odd
# is odd because a real build failed without it.
#
# Secrets this reads (all per-repo — see the bootstrap script):
#   CONFIG_JSON_BASE64           base64 of assets/config.json
#   ANDROID_KEYSTORE_BASE64      base64 of the upload keystore
#   ANDROID_KEYSTORE_PASSWORD    from android/key.properties
#   ANDROID_KEY_PASSWORD         from android/key.properties
#   PLAY_SERVICE_ACCOUNT_JSON    the Play service-account key for THIS package
#   GOOGLE_SERVICES_JSON_BASE64  optional; only if the app uses Firebase natively
#
# The Slack webhook is not a secret: android/fastlane/.env is tracked and fastlane
# loads it on its own.
##
name: Release Android

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/release-android.yml'
  workflow_dispatch:

# Never cancel. A cancelled run can already have uploaded to Play while leaving the
# versionCode file behind, and the next run then collides on a code Play has seen.
concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  release:
    # The chonky runners, registered at the Sapid-Labs org level, so every repo in
    # the org sees them with no per-repo registration. Swap for `ubuntu-latest` if
    # this app ever lives outside the org.
    runs-on: [self-hosted, chonky, android]
    timeout-minutes: 45
    permissions:
      contents: write   # to push the versionCode bump back
    steps:
      # Full history, not the default shallow clone: the version-bump step rebases
      # onto whatever landed during the build, and a rebase on a shallow clone can
      # fail for want of the common ancestor.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Ruby from the action, not from the machine: a system Ruby owns its gem dir
      # as root, and `gem install fastlane` there fails with Gem::FilePermissionError.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Flutter
        run: |
          set -eu
          # PIN THIS to the version the app is known to build with, and raise it
          # deliberately. An unpinned CI moves to whatever stable is that morning,
          # and a Flutter upgrade is not something to meet halfway through a release.
          VERSION=3.38.7
          # Cached across runs, because a self-hosted runner keeps its disk: cloning
          # into a fixed path works once and fails every time after. One directory
          # per version, reused only when it is complete.
          ROOT="$HOME/flutter-versions"
          DIR="$ROOT/$VERSION"
          mkdir -p "$ROOT"
          # Runners share this machine and can want the same version at the same
          # moment. The lock makes the second wait rather than read a half-written
          # clone, which fails much later and in confusing ways.
          exec 9>"$ROOT/.$VERSION.lock"
          flock 9
          if [ ! -x "$DIR/bin/flutter" ]; then
            rm -rf "$DIR"
            git clone --depth 1 --branch "$VERSION" \
                https://github.com/flutter/flutter.git "$DIR"
          fi
          git config --global --add safe.directory "$DIR"
          echo "$DIR/bin" >> "$GITHUB_PATH"

      - name: Restore the gitignored config and signing files
        env:
          CONFIG_JSON_BASE64: ${{ secrets.CONFIG_JSON_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -eu
          printf '%s' "$CONFIG_JSON_BASE64" | base64 -d > assets/config.json
          python3 -c "import json,sys; json.load(open(sys.argv[1]))" assets/config.json

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"

          # storeFile absolute, and the keystore outside the checkout, so no later
          # `git add` can pick it up. android/key.properties is gitignored already.
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=upload
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

          # Only if this app uses Firebase natively. Absent is fine and silent.
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" android/app/google-services.json
          fi

          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-key.json"
          python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$RUNNER_TEMP/play-key.json"

      - name: flutter pub get
        run: flutter pub get

      - name: Install fastlane
        run: gem install fastlane -N --no-document

      - name: Build and upload to the internal track
        working-directory: android
        env:
          # The `deploy` lane passes this to supply when it is set, and falls back
          # to the Appfile when it is not, so the same lane works here and by hand.
          PLAY_JSON_KEY_PATH: ${{ runner.temp }}/play-key.json
          FASTLANE_SKIP_UPDATE_CHECK: '1'
        run: fastlane internal

      # The lane bumps android/fastlane/metadata/versionCode. Without this the next
      # run reuses the number and Play rejects it. GITHUB_TOKEN pushes do not start
      # another workflow run, so this cannot loop.
      - name: Commit the version bump
        if: success()
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/fastlane/metadata/versionCode
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "chore: bump version code [skip ci]"

          # Rebase before pushing, and retry. A build takes minutes, which is long
          # enough for another push to land on main. Without this the AAB reaches
          # Play and the job still ends red, which reads like a failed release.
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            # --autostash because the build dirties the tree it runs in: fastlane
            # rewrites android/fastlane/report.xml, and a rebase refuses to start
            # with unstaged changes. Without it the retry loop fails three times
            # for a reason that has nothing to do with the race it exists for.
            if git rebase --autostash "origin/$GITHUB_REF_NAME" && git push; then
              echo "version bump pushed on attempt $attempt"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::error::could not push the version bump after 3 attempts."
          echo "::error::The build itself already uploaded. Set the versionCode file by hand."
          exit 1
